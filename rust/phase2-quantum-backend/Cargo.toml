[package]
name = "phase2_quantum_backend"
version = "0.2.0"
edition = "2021"
description = "Phase 2: Quantum Backend Contract, Calibration, and Noise Channels"

[lib]
name = "phase2_quantum_backend"
path = "src/lib.rs"

[[bin]]
name = "test_backend"
path = "examples/test_backend.rs"

[dependencies]
tch = "0.12.0"
thiserror = "1.0"
rand = "0.8"
rand_chacha = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
approx = "0.5"
